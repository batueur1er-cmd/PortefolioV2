# Met le portfolio en ligne sur GitHub Pages à chaque push sur main.
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
# Adresse : https://<compte>.github.io/<dépôt>/ ; pour un domaine à soi, renseigner SITE_URL
# dans src/app/domain/profile/seo.ts et mettre BASE_HREF à « / ».
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      BASE_HREF: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - name: Build pour le sous-dossier de GitHub Pages
        run: npx ng build --base-href "$BASE_HREF" && node scripts/seo.mjs
      # Une application à une seule page : toute adresse inconnue retombe sur l'application.
      - run: cp dist/portfolio-v2/browser/index.html dist/portfolio-v2/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-v2/browser
      - id: deploiement
        uses: actions/deploy-pages@v4
