<div class="layer" aria-hidden="true" inert>
  <app-portfolio-page class="layer-page" mode="xray" [decorative]="true" [vh]="vh()" />
</div>

<div class="ring" #ring aria-hidden="true">
  <svg class="arc" viewBox="0 0 100 100">
    <circle class="arc-track" cx="50" cy="50" r="49" pathLength="100" />
    <circle class="arc-bar" cx="50" cy="50" r="49" pathLength="100" [style.stroke-dashoffset]="100 - progress() * 100" />
  </svg>
  <span class="zoom">×{{ zoomLabel() }}</span>
</div>

<p class="help">Loupe intégrée · Maj + molette : zoom · Échap : fermer</p>
