<div class="stage">
  <app-portfolio-page [mode]="xrayView() ? 'xray' : 'surface'" [vh]="vh()" />
  @if (inpageLens()) {
    <app-inpage-lens [vh]="vh()" (closed)="inpageLens.set(false)" />
  }
</div>

<app-lens-frames />
<app-found-toast [notice]="notice()" />
<app-control-dock
  [inpageLens]="inpageLens()"
  [xrayView]="xrayView()"
  [singularityAvailable]="singularityAvailable()"
  (openLens)="openLensWindow()"
  (toggleInpage)="toggleInpage()"
  (toggleXray)="toggleXray()"
  (openSingularity)="setSingularity(true, true)"
/>

@defer (when singularityOpen()) {
  @if (singularityOpen()) {
    <app-singularity-overlay (closed)="setSingularity(false, true)" />
  }
}
